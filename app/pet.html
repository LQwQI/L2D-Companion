<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' pet: blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: pet:; connect-src 'self' pet: data: blob:; font-src 'self' data:; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'"
  />
  <title>L2D Companion</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    #stage {
      position: fixed;
      inset: 0;
    }
    #stage canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    #error {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      box-sizing: border-box;
      color: #dbe4f5;
      font: 13px/1.6 'Microsoft YaHei', sans-serif;
      background: transparent;
      overflow: auto;
      -webkit-app-region: drag;
    }
    #error .error-card {
      width: 100%;
      max-width: 320px;
      box-sizing: border-box;
      padding: 22px 20px;
      border-radius: 18px;
      background: rgba(18, 22, 32, 0.94);
      border: 1px solid rgba(120, 150, 220, 0.25);
      -webkit-app-region: drag;
    }
    #error .error-title {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }
    #error .error-text {
      font-size: 12.5px;
      color: #aeb9cf;
      white-space: pre-wrap;
      margin-bottom: 16px;
      word-break: break-word;
    }
    #error .error-actions {
      display: flex;
      gap: 8px;
    }
    #error button {
      flex: 1;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid #3b4a6b;
      background: #26324d;
      color: #dfe8ff;
      font: 12.5px 'Microsoft YaHei', sans-serif;
      cursor: pointer;
      -webkit-app-region: no-drag;
    }
    #error button.primary {
      background: #4d6fd4;
      border-color: #4d6fd4;
      color: #ffffff;
    }
  </style>
  <script src="pet://core/live2dcubismcore.min.js"></script>
</head>
<body>
  <div id="stage"></div>
  <div id="error"></div>
  <script src="renderer.js"></script>
</body>
</html>
